    <script>
      // Global error interceptor for external third-party maps scripts
      (function() {
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (
            msg === 'Script error.' ||
            (typeof msg === 'string' && (
              msg.indexOf('ApiNotActivatedMapError') !== -1 ||
              msg.indexOf('Google Maps') !== -1 ||
              msg.indexOf('gm_authFailure') !== -1
            ))
          ) {
            console.warn('[Map Engine] External script activation notice intercepted:', msg);
            if (typeof window.__onMapFallback === 'function') {
              window.__onMapFallback();
            }
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          if (msg.indexOf('ApiNotActivatedMapError') !== -1 || msg.indexOf('Google Maps') !== -1) {
            console.warn('[Map Engine] Unhandled map rejection handled:', msg);
            event.preventDefault();
          }
        });

        window.gm_authFailure = function() {
          console.warn('[Google Maps Platform] Authentication failed: Maps JavaScript API is not active on this key. Falling back to OpenStreetMap.');
          if (typeof window.__onMapFallback === 'function') {
            window.__onMapFallback();
          }
        };

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return typeof a === 'string' ? a : ((a && a.message) || '');
          }).join(' ');
          if (
            joined.indexOf('ApiNotActivatedMapError') !== -1 ||
            joined.indexOf('Google Maps JavaScript API error') !== -1
          ) {
            console.warn('[Google Maps Platform] Handled unactivated API notice:', joined);
            if (typeof window.__onMapFallback === 'function') {
              window.__onMapFallback();
            }
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-stone-900 text-stone-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
